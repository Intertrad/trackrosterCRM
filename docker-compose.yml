services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: trackroster-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: trackroster
      POSTGRES_USER: trackroster
      POSTGRES_PASSWORD: trackroster

    ports:
      - '5433:5432'

    volumes:
      - trackroster_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U trackroster -d trackroster']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: trackroster-redis
    restart: unless-stopped

    ports:
      - '6379:6379'

    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: trackroster-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio-development-only
    command: server /data --console-address ':9001'
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - trackroster_minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  trackroster_postgres_data:
  trackroster_minio_data:
