name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest

    env:
      # The application connects as the non-privileged runtime role, so the
      # tenant RLS policies apply to it here exactly as they do in a deployed
      # environment. Pointing this at the owner instead would leave the
      # policies inert and the gate would prove nothing about tenant
      # isolation — tenant-rls.integration.spec.ts fails when it is.
      DATABASE_URL: postgresql://trackroster_app:trackroster_app@127.0.0.1:5432/trackroster?sslmode=disable
      # The owner. DDL and cross-tenant fixture seeding only.
      DATABASE_MIGRATION_URL: postgresql://trackroster:trackroster@127.0.0.1:5432/trackroster?sslmode=disable
      DATABASE_SEED_URL: postgresql://trackroster:trackroster@127.0.0.1:5432/trackroster?sslmode=disable
      REDIS_URL: redis://127.0.0.1:6379
      NODE_ENV: test
      JWT_ACCESS_SECRET: trackroster-ci-access-secret-0123456789-abcdefghijklmnopqrstuvwxyz
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_SECRET: trackroster-ci-refresh-secret-0123456789-abcdefghijklmnopqrstuvwxyz
      JWT_REFRESH_TTL: 7d
      PROSPECT_COOLING_OFF_MINUTES: '1440'
      # Deterministic local providers used by the integration suite. These are
      # test-only values; production secrets are never committed here.
      MFA_ENCRYPTION_KEY: '00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff'
      AUTH_PUBLIC_ORIGIN: http://127.0.0.1:3000
      MAILPIT_URL: http://127.0.0.1:58025

    services:
      postgres:
        image: postgis/postgis:16-3.4

        env:
          POSTGRES_DB: trackroster
          POSTGRES_USER: trackroster
          POSTGRES_PASSWORD: trackroster

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U trackroster -d trackroster"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7.4-alpine

        ports:
          - 6379:6379

        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      mailpit:
        image: axllent/mailpit:v1.27

        ports:
          - 58025:8025

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          version: 11.24.0
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Provision the non-privileged runtime role
        # The service container does not read
        # infrastructure/docker/postgres/init, which is what provisions this
        # role for local development, so it is applied explicitly. Idempotent.
        run: |
          PGPASSWORD=trackroster psql \
            -h 127.0.0.1 -p 5432 -U trackroster -d trackroster \
            -v ON_ERROR_STOP=1 \
            -f infrastructure/docker/postgres/init/01-runtime-role.sql

      - name: Verify migration integrity
        run: pnpm db:migrations:check

      - name: Run database migrations
        run: pnpm --filter api db:migrate

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Database and Redis integration tests
        run: pnpm --filter api test:integration

      - name: Build
        run: pnpm build
