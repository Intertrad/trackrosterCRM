name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://trackroster:trackroster@127.0.0.1:5432/trackroster
      REDIS_URL: redis://127.0.0.1:6379
      NODE_ENV: test
      JWT_ACCESS_SECRET: trackroster-ci-access-secret-0123456789-abcdefghijklmnopqrstuvwxyz
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_SECRET: trackroster-ci-refresh-secret-0123456789-abcdefghijklmnopqrstuvwxyz
      JWT_REFRESH_TTL: 7d

    services:
      postgres:
        image: postgis/postgis:16-3.4

        env:
          POSTGRES_DB: trackroster
          POSTGRES_USER: trackroster
          POSTGRES_PASSWORD: trackroster

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U trackroster -d trackroster"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7.4-alpine

        ports:
          - 6379:6379

        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          version: 11.24.0
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        run: pnpm --filter api db:migrate

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Database and Redis integration tests
        run: pnpm --filter api test:integration

      - name: Build
        run: pnpm build
